<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <g>
    <path d="M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round">
      <animate attributeName="d"
               dur="3s"
               repeatCount="indefinite"
               values="
                         M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150;
                         M150,20 C200,10 240,80 170,150 C140,220 100,180 150,20;
                         M20,150 C10,200 80,240 150,170 C220,140 180,100 20,150;
                         M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150"
               calcMode="spline"
               keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>

    <path d="M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          transform="rotate(60, 150, 150)">
      <animate attributeName="d"
               dur="3s"
               repeatCount="indefinite"
               begin="0.5s"
               values="
                         M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150;
                         M150,20 C200,10 240,80 170,150 C140,220 100,180 150,20;
                         M20,150 C10,200 80,240 150,170 C220,140 180,100 20,150;
                         M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150"
               calcMode="spline"
               keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>

    <path d="M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          transform="rotate(120, 150, 150)">
      <animate attributeName="d"
               dur="3s"
               repeatCount="indefinite"
               begin="1s"
               values="
                         M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150;
                         M150,20 C200,10 240,80 170,150 C140,220 100,180 150,20;
                         M20,150 C10,200 80,240 150,170 C220,140 180,100 20,150;
                         M150,150 C130,130 170,130 150,150 C130,170 170,170 150,150"
               calcMode="spline"
               keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>
  </g>

  <g opacity="0.3">
    <use href="#arm1" transform="scale(1.05)" stroke-width="3"/>
    <use href="#arm2" transform="scale(1.05)" stroke-width="3"/>
    <use href="#arm3" transform="scale(1.05)" stroke-width="3"/>
  </g>

  <g opacity="0.15">
    <use href="#arm1" transform="scale(1.1)" stroke-width="3"/>
    <use href="#arm2" transform="scale(1.1)" stroke-width="3"/>
    <use href="#arm3" transform="scale(1.1)" stroke-width="3"/>
  </g>
</svg>
