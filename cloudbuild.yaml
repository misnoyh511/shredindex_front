  _GOOGLE_SECRET: 'your_google_client_secret'
  _FACEBOOK_ID: 'your_facebook_app_id'
  _FACEBOOK_SECRET: 'your_facebook_app_secret'
  _EMAIL_SERVER: 'smtp://username:password@smtp.example.com:587'
