name: Combined CI/CD Pipeline for Frontend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create .env file for build
        run: |
          echo "Creating .env.local for build..."
          echo "NEXT_PUBLIC_GA_TRACKING_ID=${{ secrets.NEXT_PUBLIC_GA_TRACKING_ID }}" > .env.local
          echo "NEXT_PUBLIC_MAPBOX_API_KEY=${{ secrets.NEXT_PUBLIC_MAPBOX_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_MAPBOX_STYLE=${{ secrets.NEXT_PUBLIC_MAPBOX_STYLE }}" >> .env.local
          echo "NEXT_PUBLIC_GRAPHQL_ENDPOINT=${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}" >> .env.local
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.local
          echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" >> .env.local
          # Ensure your scripts/deploy.sh is not strictly needed if this replaces its .env creation role
          # Or call it if it does more:
          # if [ -f "scripts/deploy.sh" ]; then chmod +x scripts/deploy.sh && ./scripts/deploy.sh; fi
        env:
          # Pass all secrets needed by scripts/deploy.sh or for direct .env.local creation
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ secrets.NEXT_PUBLIC_GA_TRACKING_ID }}
          NEXT_PUBLIC_MAPBOX_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPBOX_API_KEY }}
          # ... other secrets ...
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shredindex-frontend:latest
          build-args: | # Pass relevant ARGs to Dockerfile
            NEXT_PUBLIC_GA_TRACKING_ID=${{ secrets.NEXT_PUBLIC_GA_TRACKING_ID }}
            NEXT_PUBLIC_MAPBOX_API_KEY=${{ secrets.NEXT_PUBLIC_MAPBOX_API_KEY }}
            NEXT_PUBLIC_MAPBOX_STYLE=${{ secrets.NEXT_PUBLIC_MAPBOX_STYLE }}
            NEXT_PUBLIC_GRAPHQL_ENDPOINT=${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    environment: develop
    needs: [build-frontend]
    steps:
      - name: SSH into DigitalOcean Droplet instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e # Exit on error
            echo "Starting deployment script on server $(date)..."

            # Ensure Nginx, Certbot, lsof, psmisc (for fuser) are installed
            if ! command -v nginx &> /dev/null || ! command -v certbot &> /dev/null || ! command -v lsof &> /dev/null || ! command -v fuser &> /dev/null; then
              echo "Installing prerequisites..."
              sudo apt-get update -y
              sudo apt-get install -y nginx certbot python3-certbot-nginx lsof psmisc
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/shredindex-frontend:latest"
            CONTAINER_NAME="shredindex-frontend"
            APP_PORT="3000"

            echo "Pulling image: $IMAGE_NAME"
            docker pull "$IMAGE_NAME"

            echo "Stopping and removing existing container: $CONTAINER_NAME..."
            docker stop "$CONTAINER_NAME" || true # Allow failure if not running
            docker rm -f "$CONTAINER_NAME" || true  # Force remove, allow failure if not existing
            sleep 2 # Give a moment for port to release

            echo "Checking if port $APP_PORT is in use before starting new container..."
            if sudo lsof -iTCP:"$APP_PORT" -sTCP:LISTEN -t >/dev/null; then
              echo "Port $APP_PORT is still in use. Attempting to kill..."
              sudo fuser -k -n tcp "$APP_PORT" || echo "fuser: Port $APP_PORT was not in use or fuser failed."
              sleep 2
              if sudo lsof -iTCP:"$APP_PORT" -sTCP:LISTEN -t >/dev/null; then
                echo "ERROR: Port $APP_PORT could not be freed. Exiting."
                exit 1
              fi
            fi

            echo "Running new container $CONTAINER_NAME..."
            docker run -d --restart unless-stopped --name "$CONTAINER_NAME" -p "0.0.0.0:$APP_PORT:$APP_PORT" "$IMAGE_NAME"
            echo "Waiting for container to start..."
            sleep 10 # Give Next.js app time to initialize

            NGINX_CONF_AVAILABLE="/etc/nginx/sites-available/shredindex-frontend.conf"
            NGINX_CONF_ENABLED="/etc/nginx/sites-enabled/shredindex-frontend.conf"
            SERVER_NAMES="snowmadlist.com www.snowmadlist.com shredindex.com www.shredindex.com"
            ACME_CHALLENGE_ROOT="/var/www/letsencrypt_challenges"

            echo "Resetting Nginx config for domains to HTTP only..."
            # This step is crucial: OVERWRITE the site config with a basic HTTP one.
            # This ensures any previous SSL settings by Certbot for these domains in this file are removed.
            sudo mkdir -p /etc/nginx/sites-available "$ACME_CHALLENGE_ROOT"
            sudo chown www-data:www-data "$ACME_CHALLENGE_ROOT"
            sudo tee "$NGINX_CONF_AVAILABLE" > /dev/null <<EOT
            server {
              listen 80;
              listen [::]:80;
              server_name ${SERVER_NAMES};

              location /.well-known/acme-challenge/ {
                allow all;
                root ${ACME_CHALLENGE_ROOT};
              }
              location / {
                  proxy_pass http://localhost:${APP_PORT};
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }
            EOT
            # Remove default site if it exists
            if [ -L "/etc/nginx/sites-enabled/default" ]; then
              sudo rm -f "/etc/nginx/sites-enabled/default"
            fi
            # Ensure our config is symlinked, remove if it was pointing elsewhere
            if [ -L "$NGINX_CONF_ENABLED" ] && [ "$(readlink -f "$NGINX_CONF_ENABLED")" != "$NGINX_CONF_AVAILABLE" ]; then
                sudo rm -f "$NGINX_CONF_ENABLED"
            fi
            if [ ! -L "$NGINX_CONF_ENABLED" ]; then
                sudo ln -s "$NGINX_CONF_AVAILABLE" "$NGINX_CONF_ENABLED"
            fi

            echo "Testing Nginx configuration (HTTP setup)..."
            if ! sudo nginx -t; then
              echo "Nginx config test failed (HTTP setup). Dumping current config."
              sudo cat "$NGINX_CONF_AVAILABLE"
              exit 1
            fi
            echo "Reloading Nginx..."
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "Running Certbot..."
            CERTBOT_DOMAINS_FLAGS=$(echo "${SERVER_NAMES}" | sed 's/ / -d /g' | sed 's/^/-d /')
            sudo certbot --nginx \
              ${CERTBOT_DOMAINS_FLAGS} \
              --non-interactive --agree-tos \
              -m thomas.andrew.hansen@gmail.com \
              --redirect \
              --keep-until-expiring \
              --deploy-hook "sudo systemctl reload nginx"

            echo "Final Nginx test and status check..."
            sudo nginx -t
            sudo systemctl status nginx --no-pager
            echo "Deployment finished."
