name: Combined CI/CD Pipeline on Docker Contabo

on:
  push:
    branches:
      - develop

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    environment: develop  # Specify the environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create .env files
      run: |
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh
      env:
        NEXT_PUBLIC_MAPBOX_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPBOX_API_KEY }}
        NEXT_PUBLIC_MAPBOX_STYLE: ${{ secrets.NEXT_PUBLIC_MAPBOX_STYLE }}
        NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_STRIPE_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_SECRET_KEY }}

    - name: Build and push Frontend Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/shredindex-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    environment: develop  # Specify the environment
    needs: [build-frontend]

    steps:
      - name: SSH into GCP VM instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Ensure Nginx is installed and running
            if ! command -v nginx &> /dev/null; then
              sudo apt update
              sudo apt install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # Ensure Certbot is installed
            if ! command -v certbot &> /dev/null; then
              sudo apt install -y certbot python3-certbot-nginx
            fi

            # Deploy Frontend
            docker pull ${{ secrets.DOCKER_USERNAME }}/shredindex-frontend:latest
            if [ $(docker ps -q -f name=shredindex-frontend) ]; then
              docker stop shredindex-frontend
              docker rm shredindex-frontend
            fi

            docker run -d --restart unless-stopped --name shredindex-frontend -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/shredindex-frontend:latest

            # Clean up unused images
            docker image prune -f

            # Create Nginx virtual host configuration
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled

            sudo tee /etc/nginx/sites-available/shredindex-frontend.conf > /dev/null <<EOT

            server {
              listen 80;
              server_name snowmadlist.com;
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  client_max_body_size 128M;
                  proxy_buffering off;
              }
            }
            EOT

            # Enable the virtual host configuration
            sudo ln -s /etc/nginx/sites-available/shredindex-frontend.conf /etc/nginx/sites-enabled/

            # Test and restart Nginx to apply changes
            sudo nginx -t
            sudo systemctl restart nginx

            # Obtain SSL certificates with Certbot
            sudo certbot --nginx -d snowmadlist.com --non-interactive --agree-tos -m thomas.andrew.hansen@gmail.com

            # Restart Nginx to apply the SSL configuration
            sudo systemctl restart nginx
